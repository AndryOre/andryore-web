map $remote_addr $masked_addr {
  default 0.0.0.0;
  "~^(?<octets>\d+\.\d+\.\d+)\.\d+$" "${octets}.0";
  "~^(?<hextets>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):" "${hextets}::";
}

log_format masked '$masked_addr [$time_local] "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /dev/stdout masked;

  absolute_redirect off;
  error_page 404 /404.html;

  location = /404.html {
    internal;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location = /api/stream-status {
    include /etc/nginx/snippets/security-headers.conf;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_intercept_errors on;
  }

  location /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /fonts/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/index.html $uri.html =404;
  }
}
