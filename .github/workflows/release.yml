name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tagged commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" FETCH_HEAD; then
            echo "Tagged commit ${GITHUB_SHA} is not on main"
            exit 1
          fi

      - name: Extract changelog section
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          awk -v ver="${tag_version}" '
            /^## \[/ {
              if (found) exit
              if (index($0, "## [" ver "]") == 1) { found = 1 }
              next
            }
            /^\[[^]]+\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ -z "$(tr -d '[:space:]' < release-notes.md)" ]]; then
            echo "No CHANGELOG.md section found for version ${tag_version}"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists, skipping"
          else
            release_flags=()
            if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
              release_flags+=(--prerelease --latest=false)
            fi
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              "${release_flags[@]}"
          fi
